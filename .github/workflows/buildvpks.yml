# This is a basic workflow to help you get started with Actions

name: VPK Build

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the main branch
  push:
    paths:
      - "changelog.md"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: write # needed to create the draft release

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      # - name: Original RSPNVPK download
      #   run: wget -c $(curl -s https://api.github.com/repos/mrsteyk/RSPNVPK/releases/latest | grep -o "http.*tar.gz")

      # Runs a set of commands using the runners shell
      - name: Run a multi-line script
        run: |
          sudo apt install wget zip curl
          wget ${{ secrets.LOCATIONS }}/pc/englishclient_mp_common.bsp.pak000_dir.vpk
          wget -c $(curl -s https://api.github.com/repos/taskinoz/RSPNVPK/releases/latest | grep -o "http.*tar.gz")
          tar -xf linux-x64.tar.gz
          ls
          ls ..
          sh build.sh prod
      - name: Get version
        run: echo "version=$(jq -r .Version Northstar/mod.json)" >> $GITHUB_ENV
      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "./*.zip"
          bodyFile: "changelog.md"
          token: ${{ secrets.GITHUB_TOKEN }}
          name: v${{ env.version }}
          # Tag must match mod.json so the Thunderstore workflow accepts it when the draft is published
          tag: v${{ env.version }}
          commit: ${{ github.sha }}
          draft: true
          allowUpdates: true
