name: Publish package

on:
  release:
    types: [published] # run when a new release is published
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

env:
  modName: EnhancedMenuMod # Package name on Thunderstore

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get and check version
        run: |
          version=$(jq -r .Version Northstar/mod.json)
          icepickVersion=$(jq -r .Version Icepick/mod.json)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Northstar/mod.json version '$version' must be in the format X.Y.Z"
            exit 1
          fi
          if [[ "$icepickVersion" != "$version" ]]; then
            echo "::error::Icepick/mod.json version ($icepickVersion) does not match Northstar/mod.json version ($version)"
            exit 1
          fi
          if [[ "${{ github.event_name }}" == "release" ]]; then
            tagVersion="${{ github.event.release.tag_name }}"
            tagVersion="${tagVersion#v}"
            if [[ "$tagVersion" != "$version" ]]; then
              echo "::error::Release tag version ($tagVersion) does not match mod.json version ($version)"
              exit 1
            fi
          fi
          echo "cleanVersion=$version" >> $GITHUB_ENV

      - name: Build package
        run: |
          mkdir -p ./dist/mod
          cp -R ./src/* ./dist/mod/
          cp -R ./Northstar/* ./dist/
          rm ./dist/mod/scripts/vscripts/scripts.rson
          cp ./assets/thunderstore-icon.png ./dist/icon.png
          cp ./README.md ./dist/README.md
          cp ./changelog.md ./dist/CHANGELOG.md
          find ./dist -type f

      - name: Upload Thunderstore Package
        uses: GreenTF/upload-thunderstore-package@v4.3
        with:
          path: dist
          community: northstar
          # Name of the team to publish the mod under
          namespace: ${{ github.repository_owner }}
          name: ${{ env.modName }}
          version: ${{ env.cleanVersion }}
          description: Adds more options to the settings menu, such as extra keybinds, cheats, hud enhancements and cleaner interface
          # Thunderstore API token
          token: ${{ secrets.TS_KEY }}
          # Set explicitly, the action picks an empty repository URL when this is left out
          repo: https://thunderstore.io
          # Wraps the mod in mods/Author.ModName so Northstar can load it
          wrap: mods/${{ github.repository_owner }}.${{ env.modName }}
